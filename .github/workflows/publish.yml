name: Publish benchmark results

on:
  workflow_call:
    inputs:
      commits:
        description: Comma-separated Numba commits benchmarked by the calling run
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-benchmark-results
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: bench-result-*
          path: artifacts

      - name: Merge results
        run: python src/bench.py merge artifacts --out results/data/

      - name: Check for new results
        id: new
        run: |
          changed=$(git status --porcelain --untracked-files=all -- results/data |
            awk '{print $2}' | grep -E '^results/data/[0-9a-f]{40}\.json$' || true)
          if [ -n "$changed" ]; then
            echo 'any=true' >> "$GITHUB_OUTPUT"
          else
            echo 'any=false' >> "$GITHUB_OUTPUT"
            echo 'No new results.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update results index
        if: steps.new.outputs.any == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/results_readme.py

      - name: Commit results
        if: steps.new.outputs.any == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          changed=$(git status --porcelain --untracked-files=all -- results/data |
            awk '{print $2}' | grep -E '^results/data/[0-9a-f]{40}\.json$')
          shas=$(echo "$changed" | xargs -n1 basename | sed 's/\.json$//' | tr '\n' ' ')
          git add --all results
          git commit -m 'Add benchmark results' -m "$shas"
          git push

      - name: Dispatch pages build
        if: steps.new.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMITS: ${{ inputs.commits }}
        run: |
          if [ -n "$COMMITS" ]; then
            gh workflow run pages.yml -f commits="$COMMITS"
          else
            gh workflow run pages.yml
          fi

      - name: Build page
        if: steps.new.outputs.any == 'true'
        env:
          COMMITS: ${{ inputs.commits }}
        run: |
          if [ -n "$COMMITS" ]; then
            python src/bench.py report --results results/ \
              --commits "$COMMITS" --out site/index.html
          else
            python src/bench.py report --results results/ --out site/index.html
          fi

      - id: upload-report
        if: steps.new.outputs.any == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: site
          if-no-files-found: error

      - name: Add summary to the run
        if: steps.new.outputs.any == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload-report.outputs.artifact-url }}
        run: |
          python src/bench.py summary --results results/ \
            --commits "${{ inputs.commits }}" \
            --artifact-url "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

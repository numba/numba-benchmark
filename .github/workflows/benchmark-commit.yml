name: benchmark commit

on:
  workflow_call:
    inputs:
      commit:
        description: Full 40-character Numba commit SHA to benchmark
        required: true
        type: string
      position:
        description: First-parent position of the commit in Numba history
        required: false
        type: number
        default: 0
      repository:
        description: Repository holding the benchmark code (defaults to the caller)
        required: false
        type: string
        default: ''
      ref:
        description: Ref of the benchmark repository (defaults to the caller ref)
        required: false
        type: string
        default: ''
    outputs:
      result:
        description: Merged benchmark JSON for the commit
        value: ${{ jobs.collect.outputs.result }}
      artifact:
        description: Name of the artifact holding the commit JSON
        value: ${{ jobs.collect.outputs.artifact }}

permissions:
  contents: read

env:
  WHEELS_INDEX_URL: https://pypi.anaconda.org/numba/label/dev/simple

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}

      - name: Build environment matrix
        id: matrix
        run: |
          matrix=$(python -c 'import json; from env_matrix import ENVIRONMENTS; print(json.dumps({"include": ENVIRONMENTS}))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  benchmark:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install NumPy, SciPy, and llvmlite
        run: |
          python -m pip install --upgrade pip
          python -m pip install '${{ matrix.spec }}' scipy
          python -m pip install --no-cache-dir --pre -i "$WHEELS_INDEX_URL" llvmlite

      - name: Install Numba from ${{ inputs.commit }}
        run: python -m pip install 'git+https://github.com/numba/numba.git@${{ inputs.commit }}'

      - name: Run benchmarks
        env:
          COMMIT: ${{ inputs.commit }}
          POSITION: ${{ inputs.position }}
        run: |
          args=()
          if [ "$POSITION" -gt 0 ]; then args+=(--position "$POSITION"); fi
          mkdir -p bench-out
          python bench.py run \
            --commit "$COMMIT" \
            "${args[@]}" \
            --os "${{ matrix.os }}" \
            --python "${{ matrix.python }}" \
            --numpy "${{ matrix.numpy }}" \
            --out "bench-out/$COMMIT.${{ matrix.os }}-${{ matrix.python }}-${{ matrix.numpy }}.json"

      - name: Upload environment result
        uses: actions/upload-artifact@v4
        with:
          name: bench-env-${{ inputs.commit }}-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.numpy }}
          path: bench-out/*.json
          if-no-files-found: error

  collect:
    needs: benchmark
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.result.outputs.result }}
      artifact: ${{ steps.result.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}

      - name: Download environment results
        uses: actions/download-artifact@v4
        with:
          pattern: bench-env-${{ inputs.commit }}-*
          path: artifacts

      - name: Merge environment results
        run: python bench.py merge artifacts --out bench-result

      - name: Expose commit result
        id: result
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          file="bench-result/$COMMIT.json"
          test -f "$file"
          echo "artifact=bench-result-$COMMIT" >> "$GITHUB_OUTPUT"
          echo "result<<BENCHMARK_JSON_EOF" >> "$GITHUB_OUTPUT"
          cat "$file" >> "$GITHUB_OUTPUT"
          echo "BENCHMARK_JSON_EOF" >> "$GITHUB_OUTPUT"

      - name: Upload commit result
        uses: actions/upload-artifact@v4
        with:
          name: bench-result-${{ inputs.commit }}
          path: bench-result/${{ inputs.commit }}.json
          if-no-files-found: error

name: benchmarks

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      from:
        description: 'First Numba commit (exclusive) for a historic backfill'
        required: false
      to:
        description: 'Last Numba commit (inclusive) for a historic backfill'
        required: false
      limit:
        description: 'Maximum commits per backfill (default 10, max 50)'
        required: false
        default: '10'
      ref:
        description: 'Numba branch to benchmark when from/to are empty'
        required: false
        default: 'main'

permissions:
  contents: write
  pages: write
  id-token: write

env:
  WHEELS_INDEX_URL: https://pypi.anaconda.org/numba/label/dev/simple

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - uses: actions/checkout@v4

      - name: Plan commits and environments
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_FROM: ${{ inputs.from }}
          DISPATCH_TO: ${{ inputs.to }}
          DISPATCH_LIMIT: ${{ inputs.limit }}
          DISPATCH_REF: ${{ inputs.ref }}
        run: python ci.py plan >> "$GITHUB_OUTPUT"

  bench:
    needs: prepare
    if: needs.prepare.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install NumPy, SciPy, and llvmlite
        run: |
          python -m pip install --upgrade pip
          python -m pip install '${{ matrix.spec }}' scipy
          python -m pip install --no-cache-dir --pre -i "$WHEELS_INDEX_URL" llvmlite

      - name: Install Numba from ${{ matrix.commit }}
        run: python -m pip install 'git+https://github.com/numba/numba.git@${{ matrix.commit }}'

      - name: Run benchmarks
        run: |
          mkdir -p bench-out
          python bench.py run \
            --commit "${{ matrix.commit }}" \
            --os "${{ matrix.os }}" \
            --python "${{ matrix.python }}" \
            --numpy "${{ matrix.numpy }}" \
            --out "bench-out/${{ matrix.commit }}.${{ matrix.os }}-${{ matrix.python }}-${{ matrix.numpy }}.json"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.commit }}-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.numpy }}
          path: bench-out/*.json
          if-no-files-found: error

  publish:
    needs: [prepare, bench]
    if: always() && needs.prepare.outputs.has_work == 'true' && needs.bench.result != 'cancelled'
    runs-on: ubuntu-latest
    outputs:
      has_results: ${{ steps.merge.outputs.has_results }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          path: artifacts

      - name: Merge results
        id: merge
        run: |
          python bench.py merge artifacts --out results/
          if ls results/*.json >/dev/null 2>&1; then
            echo 'has_results=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_results=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Add comparisons to the run summary
        run: |
          if [ -z "$(git status --porcelain -- results)" ]; then
            echo 'No new results.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for file in $(git status --porcelain -- results | awk '{print $2}'); do
            sha=$(basename "$file" .json)
            {
              echo "## ${sha:0:10}"
              python bench.py compare --results results/ --commit "$sha"
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Commit results
        run: |
          if [ -z "$(git status --porcelain -- results)" ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          shas=$(git status --porcelain -- results | awk '{print $2}' | xargs -n1 basename | sed 's/\.json$//' | tr '\n' ' ')
          git add results
          git commit -m 'Add benchmark results' -m "$shas"
          git push

  report:
    needs: [prepare, bench, publish]
    if: always() && needs.publish.result == 'success' && needs.publish.outputs.has_results == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Build page
        run: python bench.py report --results results/ --out site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

name: benchmarks

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      last:
        description: 'Benchmark the last N commits of ref (overrides from/to)'
        required: false
      from:
        description: 'First Numba commit (exclusive) for a historic backfill'
        required: false
      to:
        description: 'Last Numba commit (inclusive) for a historic backfill'
        required: false
      limit:
        description: 'Maximum commits per backfill (default 10, max 50)'
        required: false
        default: '10'
      ref:
        description: 'Numba branch to benchmark when from/to are empty'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
      commits: ${{ steps.plan.outputs.commits }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Plan commits
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_FROM: ${{ inputs.from }}
          DISPATCH_TO: ${{ inputs.to }}
          DISPATCH_LAST: ${{ inputs.last }}
          DISPATCH_LIMIT: ${{ inputs.limit }}
          DISPATCH_REF: ${{ inputs.ref }}
        run: python ci.py plan >> "$GITHUB_OUTPUT"

  bench:
    needs: prepare
    if: needs.prepare.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/benchmark-commit.yml
    with:
      commit: ${{ matrix.commit }}
      position: ${{ matrix.position }}

  publish:
    needs: [prepare, bench]
    if: always() && needs.prepare.outputs.has_work == 'true' && needs.bench.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: recursive
          token: ${{ secrets.RESULTS_PUSH_TOKEN || github.token }}

      - name: Download results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: bench-result-*
          path: artifacts

      - name: Merge results
        run: python bench.py merge artifacts --out results/

      - name: Check for new results
        id: new
        run: |
          changed=$(git -C results status --porcelain --untracked-files=all |
            awk '{print $2}' | grep -E '^[0-9a-f]{40}\.json$' || true)
          if [ -n "$changed" ]; then
            echo 'any=true' >> "$GITHUB_OUTPUT"
          else
            echo 'any=false' >> "$GITHUB_OUTPUT"
            echo 'No new results.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update results README
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/results_readme.py \
            --results results/ --out results/COMMITS.md

      - name: Commit results
        if: steps.new.outputs.any == 'true'
        env:
          RESULTS_PUSH_TOKEN: ${{ secrets.RESULTS_PUSH_TOKEN || github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$RESULTS_PUSH_TOKEN" | base64 | tr -d '\n')
          git -C results config http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          git -C results config user.name 'github-actions[bot]'
          git -C results config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          changed=$(git -C results status --porcelain --untracked-files=all |
            awk '{print $2}' | grep -E '^[0-9a-f]{40}\.json$')
          shas=$(echo "$changed" | xargs -n1 basename | sed 's/\.json$//' | tr '\n' ' ')
          git -C results add --all
          git -C results commit -m 'Add benchmark results' -m "$shas"
          git -C results push origin HEAD:main

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results
          git commit -m 'Update benchmark results submodule' -m "$shas"
          git push

      - name: Build page
        if: steps.new.outputs.any == 'true'
        run: python bench.py report --results results/ --out site/index.html

      - id: upload-report
        if: steps.new.outputs.any == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: site
          if-no-files-found: error

      - name: Add summary to the run
        if: steps.new.outputs.any == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload-report.outputs.artifact-url }}
        run: |
          python bench.py summary --results results/ \
            --commits "${{ needs.prepare.outputs.commits }}" \
            --artifact-url "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

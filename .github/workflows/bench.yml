name: benchmarks

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      from:
        description: 'First Numba commit (exclusive) for a historic backfill'
        required: false
      to:
        description: 'Last Numba commit (inclusive) for a historic backfill'
        required: false
      limit:
        description: 'Maximum commits per backfill (default 10, max 50)'
        required: false
        default: '10'
      ref:
        description: 'Numba branch to benchmark when from/to are empty'
        required: false
        default: 'main'

permissions:
  contents: write

env:
  WHEELS_INDEX_URL: https://pypi.anaconda.org/numba/label/dev/simple

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
      commits: ${{ steps.plan.outputs.commits }}
    steps:
      - uses: actions/checkout@v4

      - name: Plan commits and environments
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_FROM: ${{ inputs.from }}
          DISPATCH_TO: ${{ inputs.to }}
          DISPATCH_LIMIT: ${{ inputs.limit }}
          DISPATCH_REF: ${{ inputs.ref }}
        run: python ci.py plan >> "$GITHUB_OUTPUT"

  bench:
    needs: prepare
    if: needs.prepare.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install NumPy, SciPy, and llvmlite
        run: |
          python -m pip install --upgrade pip
          python -m pip install '${{ matrix.spec }}' scipy
          python -m pip install --no-cache-dir --pre -i "$WHEELS_INDEX_URL" llvmlite

      - name: Install Numba from ${{ matrix.commit }}
        run: python -m pip install 'git+https://github.com/numba/numba.git@${{ matrix.commit }}'

      - name: Run benchmarks
        run: |
          mkdir -p bench-out
          python bench.py run \
            --commit "${{ matrix.commit }}" \
            --position "${{ matrix.position }}" \
            --os "${{ matrix.os }}" \
            --python "${{ matrix.python }}" \
            --numpy "${{ matrix.numpy }}" \
            --out "bench-out/${{ matrix.commit }}.${{ matrix.os }}-${{ matrix.python }}-${{ matrix.numpy }}.json"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.commit }}-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.numpy }}
          path: bench-out/*.json
          if-no-files-found: error

  publish:
    needs: [prepare, bench]
    if: always() && needs.prepare.outputs.has_work == 'true' && needs.bench.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          path: artifacts

      - name: Merge results
        run: python bench.py merge artifacts --out results/

      - name: Check for new results
        id: new
        run: |
          changed=$(git status --porcelain --untracked-files=all -- results |
            awk '{print $2}' | grep -E '^results/[0-9a-f]{40}\.json$' || true)
          if [ -n "$changed" ]; then
            echo 'any=true' >> "$GITHUB_OUTPUT"
          else
            echo 'any=false' >> "$GITHUB_OUTPUT"
            echo 'No new results.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit results
        if: steps.new.outputs.any == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          changed=$(git status --porcelain --untracked-files=all -- results |
            awk '{print $2}' | grep -E '^results/[0-9a-f]{40}\.json$')
          shas=$(echo "$changed" | xargs -n1 basename | sed 's/\.json$//' | tr '\n' ' ')
          git add results
          git commit -m 'Add benchmark results' -m "$shas"
          git push

      - name: Build page
        if: steps.new.outputs.any == 'true'
        run: python bench.py report --results results/ --out site/index.html

      - id: upload-report
        if: steps.new.outputs.any == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: site
          if-no-files-found: error

      - name: Add summary to the run
        if: steps.new.outputs.any == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload-report.outputs.artifact-url }}
        run: |
          python bench.py summary --results results/ \
            --commits "${{ needs.prepare.outputs.commits }}" \
            --artifact-url "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

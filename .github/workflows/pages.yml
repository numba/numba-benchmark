name: Benchmark pages generation

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'First Numba commit of the range (exclusive); requires to'
        required: false
        type: string
      to:
        description: 'Last Numba commit of the range (inclusive, defaults to ref head)'
        required: false
        type: string
      ref:
        description: 'Numba branch the range is resolved against (default main)'
        required: false
        type: string
      commits:
        description: 'Comma-separated commits to include (overrides from/to)'
        required: false
        type: string

permissions:
  contents: read

concurrency: pages

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      to: ${{ steps.cover.outputs.to }}
      from: ${{ steps.cover.outputs.from }}
      count: ${{ steps.cover.outputs.count }}
      present: ${{ steps.cover.outputs.present }}
      missing_count: ${{ steps.cover.outputs.missing_count }}
      commits: ${{ steps.cover.outputs.commits }}
      missing: ${{ steps.cover.outputs.missing }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: recursive

      - name: Check the requested commits or range
        id: cover
        env:
          COMMITS: ${{ inputs.commits }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          REF: ${{ inputs.ref || 'main' }}
        run: |
          if [ -n "$COMMITS" ]; then
            python src/ci_utils.py cover --commits "$COMMITS" >> "$GITHUB_OUTPUT"
          elif [ -n "$FROM" ]; then
            python src/ci_utils.py cover --from "$FROM" --to "$TO" \
              --ref "$REF" >> "$GITHUB_OUTPUT"
          else
            python src/ci_utils.py cover --count 30 --ref "$REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Report empty range
        if: steps.cover.outputs.count == '0'
        run: echo 'No commits in the requested range.' >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: check
    if: needs.check.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: recursive

      - name: Report selected range
        env:
          FROM: ${{ needs.check.outputs.from }}
          TO: ${{ needs.check.outputs.to }}
          COUNT: ${{ needs.check.outputs.count }}
          PRESENT: ${{ needs.check.outputs.present }}
          MISSING: ${{ needs.check.outputs.missing_count }}
        run: |
          echo "Page covers ${COUNT} commit(s), ${PRESENT} with results." \
            "Range: ${FROM:-start}..${TO}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MISSING" != '0' ]; then
            echo "${MISSING} commit(s) have no results yet and are omitted." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build page
        env:
          COMMITS: ${{ needs.check.outputs.commits }}
        run: |
          python src/bench.py report --results results/ \
            --commits "$COMMITS" --out site/index.html

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: pages-site
          path: site
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
